function SupportPage() {
  const [form, setForm] = useState({ name:'', email:'', subject:'', message:'' });
  const [sent, setSent] = useState(false);
  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.name || !form.email || !form.message) return;
    window.location.href = `mailto:support@egoclothing.com?subject=${encodeURIComponent(form.subject||'EGO Support Request')}&body=${encodeURIComponent(`From: ${form.name} (${form.email})\n\n${form.message}`)}`;
    setSent(true);
  };
  return (
    <div className="page-enter">
      <div className="support-layout">
        <div className="support-info">
          <div className="section-tag">GET IN TOUCH</div>
          <h2>SUPPORT</h2>
          <p>Questions about your order, sizing, or the brand? We're here. Someone from the EGO team will get back to you within 24–48 hours.</p>
          <div className="support-contact-items">
            {[
              { icon:'✉', label:'EMAIL US', value:'support@egoclothing.com' },
              { icon:'⏱', label:'RESPONSE TIME', value:'24 – 48 HOURS' },
              { icon:'📦', label:'SHIPPING', value:'WORLDWIDE · 7–14 DAYS' },
              { icon:'↩', label:'RETURNS', value:'14 DAYS FROM DELIVERY' },
            ].map(item => (
              <div key={item.label} className="contact-item">
                <div className="contact-icon">{item.icon}</div>
                <div><div className="contact-label">{item.label}</div><div className="contact-value">{item.value}</div></div>
              </div>
            ))}
          </div>
        </div>
        <div>
          <div className="section-tag">SEND A MESSAGE</div>
          <h2 style={{ fontFamily:'var(--font-gothic)', fontSize:'clamp(1.8rem,4vw,3rem)', marginBottom:'2rem', color:'var(--cream)' }}>Let us<br/>know</h2>
          {sent ? (
            <div className="form-success"><span style={{ color:'var(--red-bright)', fontSize:'1.2rem' }}>✓</span><span>Message sent. We'll be in touch shortly.</span></div>
          ) : (
            <form className="support-form" onSubmit={handleSubmit}>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem' }}>
                <div className="form-group"><label className="form-label">Name *</label><input className="form-input" placeholder="Full name" value={form.name} onChange={e => setForm({...form,name:e.target.value})} required /></div>
                <div className="form-group"><label className="form-label">Email *</label><input className="form-input" type="email" placeholder="your@email.com" value={form.email} onChange={e => setForm({...form,email:e.target.value})} required /></div>
              </div>
              <div className="form-group">
                <label className="form-label">Subject</label>
                <select className="form-select" value={form.subject} onChange={e => setForm({...form,subject:e.target.value})}>
                  <option value="">Select a topic</option>
                  {["Order Enquiry","Sizing Help","Shipping & Delivery","Returns & Exchanges","Wholesale / Stockist","Press & Media","Other"].map(o => <option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="form-group"><label className="form-label">Message *</label><textarea className="form-textarea" placeholder="Tell us what's on your mind..." value={form.message} onChange={e => setForm({...form,message:e.target.value})} required /></div>
              <button type="submit" className="form-submit">SEND MESSAGE →</button>
            </form>
          )}
          <div style={{ marginTop:'3rem', padding:'1.5rem', border:'1px solid var(--border)', background:'rgba(139,0,0,0.04)' }}>
            <div style={{ fontFamily:'var(--font-headline)', letterSpacing:'3px', fontSize:'0.7rem', color:'var(--muted)', marginBottom:'0.75rem' }}>SIZING GUIDE</div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'0.5rem', fontSize:'0.8rem', color:'var(--off-white)' }}>
              {[["XS","34–36\""],["S","36–38\""],["M","38–40\""],["L","40–42\""],["XL","42–44\""],["XXL","44–46\""]].map(([s,m]) => (
                <div key={s} style={{ display:'flex', justifyContent:'space-between', padding:'0.4rem 0', borderBottom:'1px solid var(--border)' }}>
                  <span style={{ fontFamily:'var(--font-headline)', letterSpacing:'2px', color:'var(--red-bright)' }}>{s}</span><span>{m}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

export default function App() {
  const [page, setPage] = useState("home");
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [pageKey, setPageKey] = useState(0);

  const navigate = (p) => { setPage(p); setPageKey(k => k+1); window.scrollTo({top:0,behavior:'smooth'}); };

  const addToCart = (item) => {
    setCart(prev => {
      const idx = prev.findIndex(i => i.id===item.id && i.size===item.size);
      if (idx > -1) { const u = [...prev]; u[idx] = {...u[idx], qty:(u[idx].qty||1)+1}; return u; }
      return [...prev, {...item, qty:1}];
    });
    setCartOpen(true);
  };
  const removeFromCart = (id, size) => setCart(prev => prev.filter(i => !(i.id===id && i.size===size)));
  const cartCount = cart.reduce((s,i) => s+(i.qty||1), 0);
  const cartTotal = cart.reduce((s,i) => s+i.price*(i.qty||1), 0);

  const navItems = [
    {id:'shop',label:'SHOP'},{id:'history',label:'HISTORY'},
    {id:'gallery',label:'GALLERY'},{id:'support',label:'SUPPORT'}
  ];

  return (
    <>
      <GlobalStyles />
      <nav className="nav">
        <div className="nav-logo" onClick={() => navigate('home')}>EGO</div>
        <ul className="nav-links">
          {navItems.map(n => (
            <li key={n.id} className={`nav-link ${page===n.id?'active':''}`} onClick={() => navigate(n.id)}>{n.label}</li>
          ))}
        </ul>
        <button className="cart-icon-btn" onClick={() => setCartOpen(true)}>
          <span>BAG</span>
          {cartCount > 0 && <span className="cart-badge">{cartCount}</span>}
        </button>
      </nav>

      <main>
        {page==='home' && <HomePage key={pageKey} setPage={navigate} addToCart={addToCart} />}
        {page==='shop' && <ShopPage key={pageKey} addToCart={addToCart} />}
        {page==='history' && <HistoryPage key={pageKey} />}
        {page==='gallery' && <GalleryPage key={pageKey} />}
        {page==='support' && <SupportPage key={pageKey} />}
      </main>

      <footer>
        <div className="divider" />
        <div className="footer">
          <div>
            <div className="footer-logo">EGO</div>
            <p className="footer-tagline">Wear your world.<br/>Claim your crown.<br/>Born from defiance.</p>
          </div>
          <div>
            <h4>NAVIGATE</h4>
            <ul className="footer-links">
              {[{id:'home',label:'Home'},{id:'shop',label:'Shop'},...navItems.slice(1)].map(n => (
                <li key={n.id} onClick={() => navigate(n.id)}>{n.label}</li>
              ))}
            </ul>
          </div>
          <div>
            <h4>SUPPORT</h4>
            <ul className="footer-links">
              {["Contact Us","Shipping Info","Returns Policy","Size Guide","FAQ"].map(l => (
                <li key={l} onClick={() => navigate('support')}>{l}</li>
              ))}
            </ul>
          </div>
        </div>
        <div className="footer-bottom">
          <span className="footer-copy">© {new Date().getFullYear()} EGO. ALL RIGHTS RESERVED.</span>
          <span className="footer-copy">INSTAGRAM · TIKTOK</span>
        </div>
      </footer>

      <div className={`cart-overlay ${cartOpen?'open':''}`} onClick={() => setCartOpen(false)} />
      <div className={`cart-drawer ${cartOpen?'open':''}`}>
        <div className="cart-header">
          <span className="cart-title">YOUR BAG {cartCount>0 && `(${cartCount})`}</span>
          <button className="cart-close" onClick={() => setCartOpen(false)}>✕</button>
        </div>
        <div className="cart-items">
          {cart.length === 0 ? (
            <div className="cart-empty"><span className="cart-empty-icon">EGO</span><p>YOUR BAG IS EMPTY</p></div>
          ) : (
            cart.map(item => (
              <div key={`${item.id}-${item.size}`} className="cart-item">
                <div className="cart-item-img">EGO</div>
                <div className="cart-item-details">
                  <div className="cart-item-name">{item.name}</div>
                  <div className="cart-item-meta">SIZE: {item.size} · QTY: {item.qty||1}</div>
                  <button className="cart-remove" onClick={() => removeFromCart(item.id,item.size)}>REMOVE</button>
                </div>
                <div className="cart-item-price">${item.price*(item.qty||1)}</div>
              </div>
            ))
          )}
        </div>
        {cart.length > 0 && (
          <div className="cart-footer">
            <div className="cart-subtotal"><span>SUBTOTAL</span><span>${cartTotal}.00 USD</span></div>
            <button className="checkout-btn">PROCEED TO CHECKOUT</button>
            <p style={{ fontSize:'0.7rem', color:'var(--muted)', letterSpacing:'1px', textAlign:'center', marginTop:'1rem' }}>Shipping & taxes calculated at checkout</p>
          </div>
        )}
      </div>
    </>
  );
}
