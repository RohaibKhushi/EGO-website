function ShopPage({ addToCart }) {
  const [selectedSizes, setSelectedSizes] = useState({});
  const [filter, setFilter] = useState("ALL");
  const [added, setAdded] = useState({});
  const handleAdd = (product) => {
    const size = selectedSizes[product.id];
    if (!size) return;
    addToCart({ ...product, size });
    setAdded(p => ({ ...p, [product.id]: true }));
    setTimeout(() => setAdded(p => ({ ...p, [product.id]: false })), 1500);
  };
  const displayed = products.filter(p => filter === "ALL" || p.tag === filter || (filter === "TEES" && p.name.includes("TEE")));
  return (
    <div className="page-enter">
      <div className="shop-header">
        <div className="section-tag">THE COLLECTION</div>
        <h1 className="section-title">SHOP</h1>
        <div className="shop-filters">
          {["ALL","NEW","LIMITED","TEES"].map(f => (
            <button key={f} className={`filter-btn ${filter===f?'active':''}`} onClick={() => setFilter(f)}>{f}</button>
          ))}
        </div>
      </div>
      <div style={{ maxWidth:1400, margin:'0 auto', padding:'2rem 2.5rem 8rem' }}>
        <div className="shop-grid">
          {displayed.map(product => (
            <div key={product.id} className="shop-card">
              <div style={{ position:'relative', overflow:'hidden' }}>
                <div className="shop-card-img-placeholder">EGO</div>
                <div className="shop-card-overlay" />
                {product.tag && <div className="shop-card-badge">{product.tag}</div>}
              </div>
              <div className="shop-card-body">
                <div className="shop-card-title">{product.name}</div>
                <div className="shop-card-price">${product.price}.00 USD</div>
                <p style={{ fontSize:'0.8rem', color:'var(--muted)', marginBottom:'1rem', letterSpacing:'0.5px' }}>{product.desc}</p>
                <div style={{ fontSize:'0.65rem', letterSpacing:'3px', color:'var(--muted)', marginBottom:'0.5rem', fontFamily:'var(--font-headline)' }}>SELECT SIZE</div>
                <div className="size-selector">
                  {product.sizes.map(size => (
                    <button key={size}
                      className={`size-btn ${selectedSizes[product.id]===size?'selected':''} ${product.soldOut.includes(size)?'sold-out':''}`}
                      onClick={() => !product.soldOut.includes(size) && setSelectedSizes(p => ({...p,[product.id]:size}))}
                      disabled={product.soldOut.includes(size)}
                    >{size}</button>
                  ))}
                </div>
                <button className="add-to-cart" onClick={() => handleAdd(product)} disabled={!selectedSizes[product.id]}>
                  {added[product.id] ? "✓ ADDED" : selectedSizes[product.id] ? "ADD TO CART" : "SELECT A SIZE"}
                </button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function HistoryPage() {
  return (
    <div className="page-enter">
      <div style={{ background:'linear-gradient(to bottom, rgba(139,0,0,0.08), transparent)', borderBottom:'1px solid var(--border)' }}>
        <div className="history-hero">
          <div className="section-tag">THE STORY</div>
          <h1 className="section-title" style={{ fontSize:'clamp(4rem, 10vw, 8rem)', marginBottom:'3rem' }}>THE<br/>BIRTH OF<br/>EGO</h1>
          <div className="history-body">
            <p className="history-large-text">"Born from defiance. Worn by those who refuse to be forgotten."</p>
            <p className="history-p">EGO didn't begin in a design studio or a boardroom. It began on the streets — with a vision, a gothic typeface, and the unshakable belief that clothing could carry a message louder than words.</p>
            <p className="history-p">The brand was founded on one principle: that fashion should feel like armor. Every piece EGO releases is a weapon — against mediocrity, against anonymity, against the pressure to shrink yourself to fit in.</p>
          </div>
        </div>
      </div>
      <div style={{ borderBottom:'1px solid var(--border)' }}>
        <div style={{ maxWidth:1100, margin:'0 auto', padding:'6rem 2.5rem' }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'4rem' }}>
            <div>
              <div className="history-pull-quote">
                <p>"The world is yours to hold. EGO just makes sure you look the part."</p>
              </div>
              <p className="history-p">The iconic EGO gothic lettering was crafted to feel ancient and dangerous — like a sigil carved into a wall, not printed on a tag. It was a deliberate choice. High fashion speaks quietly. EGO screams.</p>
            </div>
            <div style={{ marginTop:'2rem' }}>
              <p className="history-p">The imagery has always drawn from cultural mythology — King Kong atop the Eiffel Tower, fighters standing over fallen opponents, hands that have gripped and held the world together. These are symbols of dominance, resilience, and raw ambition.</p>
              <p className="history-p">Every drop is limited. Every graphic is intentional. EGO doesn't do filler — only statements.</p>
              <p className="history-p">This isn't fast fashion. This is slow fire.</p>
            </div>
          </div>
        </div>
      </div>
      <div className="history-timeline">
        <div className="section-tag" style={{ marginBottom:'3rem' }}>MILESTONES</div>
        {[
          { year:"2021", title:"THE BEGINNING", text:"EGO launches its first capsule — three tees, zero compromises. Sold out in 48 hours." },
          { year:"2022", title:"THE GOTHIC IDENTITY", text:"The signature blackletter EGO logotype is born. The brand's visual language crystallizes around power, myth, and the streets." },
          { year:"2023", title:"CAMPAIGNS THAT HIT DIFFERENT", text:"The Paris King Kong graphic drops and becomes the defining image — a monster atop a monument. EGO goes international." },
          { year:"2024", title:"THE WORLD IN OUR HANDS", text:"New graphics, new silhouettes, new territory. The 'World in My Hands' and 'No Mercy' collections release to sold-out audiences." },
          { year:"2025", title:"BEYOND THE TEE", text:"EGO expands its universe. The brand is no longer just clothing — it's a culture." },
        ].map(item => (
          <div key={item.year} className="timeline-item">
            <div className="timeline-year">{item.year}</div>
            <div className="timeline-content"><h3>{item.title}</h3><p>{item.text}</p></div>
          </div>
        ))}
      </div>
    </div>
  );
}

