import { useState, useEffect } from "react";

const GlobalStyles = () => (
  <style>{`
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&display=swap');

    /* ── ACID GOTH ─────────────────────────────────────────────────────────
       Drop your Acid Goth font files into your project and update the paths below.
       Supports .woff2, .woff, .ttf — use whichever you have.
       -------------------------------------------------------------------- */
    @font-face {
      font-family: 'Acid Goth';
      src: url('/fonts/AcidGoth.woff2') format('woff2'),
           url('/fonts/AcidGoth.woff')  format('woff'),
           url('/fonts/AcidGoth.ttf')   format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #060606; --deep: #0d0d0d; --charcoal: #1a1a1a; --mid: #2a2a2a;
      --border: #2f2f2f; --red: #8b0000; --red-bright: #c0392b; --red-glow: #ff1a1a;
      --cream: #e8e0d0; --off-white: #b0a898; --muted: #5a5550;
      --font-gothic: 'Acid Goth', 'UnifrakturMaguntia', cursive;
      --font-display: 'Acid Goth', 'UnifrakturMaguntia', cursive;
      --font-headline: 'Bebas Neue', sans-serif;
      --font-body: 'Barlow Condensed', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black); color: var(--cream);
      font-family: var(--font-body); overflow-x: hidden; cursor: crosshair;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--black); }
    ::-webkit-scrollbar-thumb { background: var(--red); }
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 2.5rem; height: 64px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--border);
      background: rgba(6,6,6,0.94); backdrop-filter: blur(16px);
    }
    .nav-logo {
      font-family: var(--font-gothic); font-size: 2.4rem; color: var(--cream);
      letter-spacing: 4px; text-shadow: 0 0 24px rgba(139,0,0,0.7); cursor: pointer;
      transition: text-shadow 0.3s;
    }
    .nav-logo:hover { text-shadow: 0 0 40px rgba(192,57,43,1); }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-link {
      font-family: var(--font-headline); font-size: 0.85rem; letter-spacing: 3px;
      color: var(--off-white); cursor: pointer; position: relative; transition: color 0.2s;
    }
    .nav-link::after {
      content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px;
      background: var(--red-bright); transition: width 0.3s;
    }
    .nav-link:hover, .nav-link.active { color: var(--cream); }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }
    .cart-icon-btn {
      background: none; border: 1px solid var(--border); color: var(--off-white);
      padding: 0.4rem 1rem; cursor: pointer; font-family: var(--font-headline);
      font-size: 0.75rem; letter-spacing: 2px; transition: all 0.2s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .cart-icon-btn:hover { border-color: var(--red); color: var(--cream); }
    .cart-badge {
      background: var(--red); color: var(--cream); border-radius: 50%;
      width: 18px; height: 18px; display: flex; align-items: center;
      justify-content: center; font-size: 0.65rem;
    }
    /* Hero */
    .hero {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; position: relative; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(139,0,0,0.13) 0%, transparent 70%), var(--black);
    }
    .hero-lines {
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 79px, rgba(255,255,255,0.015) 80px),
        repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(255,255,255,0.015) 80px);
    }
    .hero-content { position: relative; z-index: 2; text-align: center; padding: 2rem; }
    .hero-eyebrow {
      font-family: var(--font-headline); font-size: 0.75rem; letter-spacing: 8px;
      color: var(--red-bright); margin-bottom: 1.5rem;
      opacity: 0; animation: fadeUp 0.8s 0.2s forwards;
    }
    .hero-title {
      font-family: var(--font-gothic); font-size: clamp(6rem, 20vw, 18rem);
      line-height: 0.85; color: var(--cream);
      text-shadow: 0 0 60px rgba(139,0,0,0.45), 0 0 120px rgba(139,0,0,0.2);
      opacity: 0; animation: fadeUp 1s 0.4s forwards; margin-bottom: 1rem;
    }
    .hero-sub {
      font-family: var(--font-headline); font-size: clamp(0.85rem, 2vw, 1.1rem);
      letter-spacing: 7px; color: var(--off-white);
      opacity: 0; animation: fadeUp 0.8s 0.8s forwards; margin-bottom: 3rem;
    }
    .hero-cta { display: inline-flex; gap: 1.5rem; opacity: 0; animation: fadeUp 0.8s 1.1s forwards; }
    .hero-scroll {
      position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      opacity: 0; animation: fadeUp 0.8s 1.5s forwards;
    }
    .hero-scroll span { font-family: var(--font-headline); font-size: 0.65rem; letter-spacing: 4px; color: var(--muted); }
    .scroll-line { width: 1px; height: 40px; background: linear-gradient(to bottom, var(--red), transparent); animation: scrollPulse 1.5s infinite; }
    /* Buttons */
    .btn-primary {
      font-family: var(--font-headline); font-size: 0.9rem; letter-spacing: 4px;
      padding: 0.9rem 2.5rem; background: var(--red); color: var(--cream);
      border: 1px solid var(--red); cursor: pointer; transition: all 0.25s;
      position: relative; overflow: hidden;
    }
    .btn-primary::before {
      content: ''; position: absolute; inset: 0; background: var(--red-bright);
      transform: translateX(-100%); transition: transform 0.3s;
    }
    .btn-primary:hover::before { transform: translateX(0); }
    .btn-primary span { position: relative; z-index: 1; }
    .btn-secondary {
      font-family: var(--font-headline); font-size: 0.9rem; letter-spacing: 4px;
      padding: 0.9rem 2.5rem; background: transparent; color: var(--cream);
      border: 1px solid var(--border); cursor: pointer; transition: all 0.25s;
    }
    .btn-secondary:hover { border-color: var(--off-white); background: rgba(255,255,255,0.04); }
    /* Section */
    .section { padding: 8rem 2.5rem; max-width: 1400px; margin: 0 auto; }
    .section-tag {
      font-family: var(--font-headline); font-size: 0.7rem; letter-spacing: 6px;
      color: var(--red-bright); margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;
    }
    .section-tag::after { content: ''; flex: 1; max-width: 60px; height: 1px; background: var(--red); }
    .section-title { font-family: var(--font-gothic); font-size: clamp(3rem, 6vw, 5.5rem); line-height: 0.9; color: var(--cream); margin-bottom: 2rem; }
    .divider { width: 100%; height: 1px; background: linear-gradient(to right, transparent, var(--border), transparent); }
    /* Products grid */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5px; background: var(--border); }
    .product-card { background: var(--deep); overflow: hidden; cursor: pointer; }
    .product-img-placeholder {
      width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, var(--charcoal), var(--deep));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-gothic); font-size: 4rem; color: var(--border);
      transition: all 0.5s;
    }
    .product-card:hover .product-img-placeholder { color: var(--muted); transform: scale(1.03); }
    .product-info { padding: 1.5rem; border-top: 1px solid var(--border); }
    .product-name { font-family: var(--font-headline); font-size: 1.1rem; letter-spacing: 3px; color: var(--cream); margin-bottom: 0.3rem; }
    .product-price { font-size: 0.85rem; color: var(--off-white); letter-spacing: 2px; }
    /* Shop */
    .shop-header { padding: 10rem 2.5rem 4rem; border-bottom: 1px solid var(--border); max-width: 1400px; margin: 0 auto; }
    .shop-filters { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 2rem; }
    .filter-btn {
      font-family: var(--font-headline); font-size: 0.75rem; letter-spacing: 3px;
      padding: 0.5rem 1.5rem; background: transparent; color: var(--off-white);
      border: 1px solid var(--border); cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { border-color: var(--red); color: var(--cream); background: rgba(139,0,0,0.1); }
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 2px; background: var(--border); }
    .shop-card { background: var(--deep); overflow: hidden; cursor: pointer; position: relative; }
    .shop-card-img-placeholder {
      width: 100%; aspect-ratio: 3/4; background: linear-gradient(160deg, var(--charcoal), var(--deep));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-gothic); font-size: 5rem; color: var(--border); transition: all 0.5s;
    }
    .shop-card:hover .shop-card-img-placeholder { color: var(--muted); transform: scale(1.03); }
    .shop-card-overlay { position: absolute; top: 0; left: 0; right: 0; aspect-ratio: 3/4; background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%); pointer-events: none; }
    .shop-card-badge { position: absolute; top: 1rem; left: 1rem; font-family: var(--font-headline); font-size: 0.65rem; letter-spacing: 3px; padding: 0.3rem 0.8rem; background: var(--red); color: var(--cream); }
    .shop-card-body { padding: 1.5rem; border-top: 1px solid var(--border); }
    .shop-card-title { font-family: var(--font-headline); font-size: 1.2rem; letter-spacing: 3px; color: var(--cream); margin-bottom: 0.5rem; }
    .shop-card-price { font-size: 0.9rem; color: var(--off-white); letter-spacing: 1px; margin-bottom: 1.2rem; }
    .size-selector { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .size-btn {
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-headline); font-size: 0.75rem; letter-spacing: 1px;
      background: transparent; color: var(--off-white); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.2s;
    }
    .size-btn:hover { border-color: var(--off-white); color: var(--cream); }
    .size-btn.selected { border-color: var(--red); background: var(--red); color: var(--cream); }
    .size-btn.sold-out { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }
    .add-to-cart {
      width: 100%; font-family: var(--font-headline); font-size: 0.85rem; letter-spacing: 4px;
      padding: 0.8rem; background: var(--red); color: var(--cream); border: none;
      cursor: pointer; transition: all 0.25s;
    }
    .add-to-cart:hover { background: var(--red-bright); }
    .add-to-cart:disabled { background: var(--muted); cursor: not-allowed; }
    /* History */
    .history-hero { padding: 12rem 2.5rem 6rem; max-width: 1100px; margin: 0 auto; }
    .history-body { max-width: 780px; }
    .history-large-text { font-family: var(--font-gothic); font-size: clamp(1.5rem, 3vw, 2.2rem); line-height: 1.3; color: var(--cream); margin-bottom: 2rem; }
    .history-p { font-size: 1rem; line-height: 1.9; color: var(--off-white); margin-bottom: 1.8rem; font-weight: 300; letter-spacing: 0.5px; }
    .history-pull-quote { padding: 2.5rem; border-left: 3px solid var(--red); margin: 3rem 0; background: rgba(139,0,0,0.06); }
    .history-pull-quote p { font-family: var(--font-gothic); font-size: clamp(1.2rem, 2.5vw, 1.8rem); color: var(--cream); line-height: 1.4; }
    .history-timeline { padding: 6rem 2.5rem; max-width: 1000px; margin: 0 auto; border-top: 1px solid var(--border); }
    .timeline-item { display: grid; grid-template-columns: 80px 1fr; gap: 2rem; margin-bottom: 3rem; align-items: start; }
    .timeline-year { font-family: var(--font-headline); font-size: 1.4rem; letter-spacing: 2px; color: var(--red-bright); }
    .timeline-content h3 { font-family: var(--font-headline); font-size: 1.1rem; letter-spacing: 3px; color: var(--cream); margin-bottom: 0.5rem; }
    .timeline-content p { font-size: 0.9rem; color: var(--off-white); line-height: 1.7; }
    /* Gallery */
    .gallery-header { padding: 10rem 2.5rem 4rem; max-width: 1400px; margin: 0 auto; }
    .gallery-grid {
      display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 220px;
      gap: 2px; background: var(--border);
    }
    .gallery-item { background: var(--charcoal); overflow: hidden; cursor: pointer; position: relative; }
    .gallery-item:nth-child(1) { grid-column: span 5; grid-row: span 2; }
    .gallery-item:nth-child(2) { grid-column: span 4; }
    .gallery-item:nth-child(3) { grid-column: span 3; }
    .gallery-item:nth-child(4) { grid-column: span 4; grid-row: span 2; }
    .gallery-item:nth-child(5) { grid-column: span 3; }
    .gallery-item:nth-child(6) { grid-column: span 4; }
    .gallery-item:nth-child(7) { grid-column: span 3; grid-row: span 2; }
    .gallery-item:nth-child(8) { grid-column: span 5; }
    .gallery-item:nth-child(9) { grid-column: span 4; }
    .gallery-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-gothic); font-size: 2.5rem; color: var(--border); transition: color 0.3s;
    }
    .gallery-item:hover .gallery-placeholder { color: var(--muted); transform: scale(1.05); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(15%); transition: all 0.5s; }
    .gallery-item:hover img { filter: grayscale(0%); transform: scale(1.05); }
    /* Support */
    .support-layout {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6rem;
      padding: 10rem 4rem 8rem; max-width: 1200px; margin: 0 auto;
    }
    .support-info h2 { font-family: var(--font-gothic); font-size: clamp(2.5rem, 5vw, 4.5rem); line-height: 0.95; color: var(--cream); margin-bottom: 2rem; }
    .support-info p { font-size: 0.95rem; line-height: 1.8; color: var(--off-white); margin-bottom: 3rem; }
    .support-contact-items { display: flex; flex-direction: column; gap: 1.5rem; }
    .contact-item { display: flex; align-items: flex-start; gap: 1rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .contact-icon { width: 36px; height: 36px; border: 1px solid var(--red); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; color: var(--red-bright); }
    .contact-label { font-family: var(--font-headline); font-size: 0.7rem; letter-spacing: 3px; color: var(--muted); margin-bottom: 0.25rem; }
    .contact-value { font-size: 0.95rem; color: var(--cream); letter-spacing: 1px; }
    .support-form { display: flex; flex-direction: column; gap: 1.5rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-label { font-family: var(--font-headline); font-size: 0.7rem; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
    .form-input, .form-select, .form-textarea {
      background: var(--deep); border: 1px solid var(--border); color: var(--cream);
      font-family: var(--font-body); font-size: 0.95rem; padding: 0.9rem 1rem;
      outline: none; transition: border-color 0.2s; width: 100%;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--red); }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--muted); }
    .form-select option { background: var(--deep); }
    .form-textarea { resize: vertical; min-height: 140px; }
    .form-submit {
      font-family: var(--font-headline); font-size: 0.9rem; letter-spacing: 4px;
      padding: 1rem 2rem; background: var(--red); color: var(--cream); border: none;
      cursor: pointer; transition: all 0.25s; align-self: flex-start;
    }
    .form-submit:hover { background: var(--red-bright); }
    .form-success {
      padding: 1rem 1.5rem; border: 1px solid var(--red); background: rgba(139,0,0,0.1);
      color: var(--cream); font-size: 0.9rem; letter-spacing: 1px;
      display: flex; align-items: center; gap: 0.75rem;
    }
    /* Cart drawer */
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .cart-overlay.open { opacity: 1; pointer-events: all; }
    .cart-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100vw;
      background: var(--deep); border-left: 1px solid var(--border); z-index: 201;
      transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column;
    }
    .cart-drawer.open { transform: translateX(0); }
    .cart-header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .cart-title { font-family: var(--font-headline); font-size: 1rem; letter-spacing: 4px; color: var(--cream); }
    .cart-close { background: none; border: 1px solid var(--border); color: var(--off-white); width: 36px; height: 36px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .cart-close:hover { border-color: var(--red); color: var(--cream); }
    .cart-items { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }
    .cart-item { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid var(--border); }
    .cart-item-img { width: 72px; height: 72px; background: var(--charcoal); display: flex; align-items: center; justify-content: center; font-family: var(--font-gothic); font-size: 1rem; color: var(--muted); flex-shrink: 0; }
    .cart-item-details { flex: 1; }
    .cart-item-name { font-family: var(--font-headline); letter-spacing: 2px; font-size: 0.9rem; color: var(--cream); margin-bottom: 0.25rem; }
    .cart-item-meta { font-size: 0.8rem; color: var(--muted); letter-spacing: 1px; }
    .cart-item-price { font-size: 0.9rem; color: var(--off-white); }
    .cart-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.75rem; letter-spacing: 1px; transition: color 0.2s; font-family: var(--font-headline); margin-top: 0.5rem; display: block; }
    .cart-remove:hover { color: var(--red-bright); }
    .cart-empty { text-align: center; padding: 4rem 1rem; color: var(--muted); }
    .cart-empty-icon { font-family: var(--font-gothic); font-size: 4rem; margin-bottom: 1rem; display: block; }
    .cart-empty p { font-family: var(--font-headline); letter-spacing: 3px; font-size: 0.8rem; }
    .cart-footer { padding: 1.5rem 2rem; border-top: 1px solid var(--border); }
    .cart-subtotal { display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .cart-subtotal span { font-family: var(--font-headline); letter-spacing: 3px; font-size: 0.85rem; color: var(--off-white); }
    .checkout-btn { width: 100%; font-family: var(--font-headline); font-size: 0.9rem; letter-spacing: 4px; padding: 1rem; background: var(--cream); color: var(--black); border: none; cursor: pointer; transition: all 0.25s; }
    .checkout-btn:hover { background: var(--off-white); }
    /* Footer */
    .footer { padding: 5rem 2.5rem 2rem; display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 4rem; max-width: 1400px; margin: 0 auto; }
    .footer-logo { font-family: var(--font-gothic); font-size: 3rem; color: var(--cream); text-shadow: 0 0 20px rgba(139,0,0,0.4); margin-bottom: 1rem; }
    .footer-tagline { font-size: 0.85rem; color: var(--muted); letter-spacing: 1.5px; line-height: 1.8; max-width: 280px; }
    .footer-col h4 { font-family: var(--font-headline); font-size: 0.7rem; letter-spacing: 4px; color: var(--red-bright); margin-bottom: 1.5rem; }
    .footer-links { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
    .footer-links li { font-size: 0.85rem; color: var(--off-white); cursor: pointer; transition: color 0.2s; letter-spacing: 1px; }
    .footer-links li:hover { color: var(--cream); }
    .footer-bottom { border-top: 1px solid var(--border); padding: 1.5rem 2.5rem; display: flex; justify-content: space-between; max-width: 1400px; margin: 0 auto; }
    .footer-copy { font-size: 0.75rem; color: var(--muted); letter-spacing: 2px; }
    .page-enter { opacity: 0; animation: pageIn 0.5s forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scrollPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes pageIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 900px) {
      .support-layout { grid-template-columns: 1fr; gap: 3rem; padding: 8rem 1.5rem 4rem; }
      .footer { grid-template-columns: 1fr 1fr; }
      .gallery-item { grid-column: span 6 !important; grid-row: span 1 !important; }
      .gallery-grid { grid-template-columns: repeat(6, 1fr); grid-auto-rows: 180px; }
    }
    @media (max-width: 600px) {
      .nav-links { gap: 1rem; }
      .nav-link { font-size: 0.7rem; letter-spacing: 1.5px; }
      .hero-title { font-size: clamp(4.5rem, 28vw, 8rem); }
      .footer { grid-template-columns: 1fr; gap: 2rem; }
      .gallery-item { grid-column: span 6 !important; grid-row: span 1 !important; }
    }
  `}</style>
);

